<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地圖編輯器 - 星際合成塔防</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0c10; color: #c5c6c7;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        #toolbar {
            width: 100%; background: #1f2833; border-bottom: 2px solid #45a29e;
            display: flex; align-items: center; gap: 10px; padding: 7px 14px;
            flex-shrink: 0; flex-wrap: wrap; z-index: 10;
        }
        #toolbar label { color: #66fcf1; font-weight: bold; font-size: 13px; white-space: nowrap; }
        #toolbar input[type="text"] {
            background: #0b0c10; border: 1px solid #45a29e; color: #fff;
            padding: 4px 8px; border-radius: 4px; width: 140px; font-size: 13px;
        }
        #toolbar button {
            background: #1f2833; color: #66fcf1; border: 1px solid #45a29e;
            padding: 5px 12px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 12px; transition: all 0.2s; white-space: nowrap;
        }
        #toolbar button:hover { background: rgba(69,162,158,0.4); }
        #toolbar button.primary { background: #45a29e; color: #fff; border-color: #66fcf1; }
        #toolbar button.primary:hover { background: #66fcf1; color: #0b0c10; }
        #toolbar button.export-btn { background: #ffd700; color: #000; border-color: #ffd700; }
        #toolbar button.export-btn:hover { background: #ffe44d; }
        #toolbar .sep { width: 1px; height: 26px; background: #45a29e; margin: 0 4px; }
        #main-area {
            flex: 1; display: flex; width: 100%; align-items: stretch;
            overflow: hidden; min-height: 0;
        }
        #canvas-wrap {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px; min-width: 0;
        }
        canvas {
            border: 1px solid #1f2833; cursor: crosshair;
            background: #111e25; max-width: 100%; max-height: 100%;
        }
        #side-panel {
            width: 210px; background: #151d25; border-left: 2px solid #45a29e;
            display: flex; flex-direction: column; padding: 10px; gap: 12px;
            overflow-y: auto; flex-shrink: 0;
        }
        .panel-section { }
        .panel-section h3 {
            color: #66fcf1; font-size: 13px; margin-bottom: 6px;
            border-bottom: 1px solid #2a3a4a; padding-bottom: 4px;
        }
        .palette-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        }
        .brush-btn {
            display: flex; flex-direction: column; align-items: center;
            background: #1f2833; border: 2px solid transparent; color: #c5c6c7;
            border-radius: 6px; padding: 6px 4px; cursor: pointer;
            transition: all 0.15s; font-size: 11px; font-weight: bold;
        }
        .brush-btn:hover { background: #2b3a4a; }
        .brush-btn.active { border-color: #66fcf1; box-shadow: 0 0 12px rgba(102,252,241,0.4); }
        .brush-btn .brush-preview {
            width: 28px; height: 28px; border-radius: 3px; margin-bottom: 3px;
            border: 1px solid #444;
        }
        .brush-btn .brush-label { white-space: nowrap; }
        .path-tool-btn {
            display: block; width: 100%; background: #1f2833; border: 1px solid #3a4a5a;
            color: #c5c6c7; padding: 7px 10px; border-radius: 5px; cursor: pointer;
            font-size: 12px; font-weight: bold; text-align: left; transition: all 0.15s;
            margin-bottom: 4px;
        }
        .path-tool-btn:hover { background: #2b3a4a; }
        .path-tool-btn.active { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 8px rgba(255,215,0,0.3); }
        .info-row {
            display: flex; justify-content: space-between; font-size: 12px;
            padding: 2px 0; color: #8a9aaa;
        }
        .info-row span { color: #ffd700; }
        #status-bar {
            width: 100%; background: #1f2833; border-top: 1px solid #2a3a4a;
            display: flex; align-items: center; gap: 20px; padding: 4px 14px;
            font-size: 12px; color: #8a9aaa; flex-shrink: 0;
        }
        #status-bar span.active { color: #66fcf1; font-weight: bold; }
        .key-hint { color: #555; margin-left: 6px; font-size: 11px; }
        #toast {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(69,162,158,0.95); color: #fff; padding: 10px 24px;
            border-radius: 6px; font-weight: bold; font-size: 14px; z-index: 999;
            pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="toolbar">
    <label>📛 地圖名稱</label>
    <input type="text" id="mapName" value="新地圖" placeholder="輸入地圖名稱">
    <div class="sep"></div>
    <button onclick="newMap()" title="清空重來">🆕 新地圖</button>
    <button onclick="document.getElementById('importFile').click()">📥 載入 JSON</button>
    <button class="export-btn" onclick="exportMap()">📤 匯出 JSON</button>
    <div class="sep"></div>
    <button id="btn-preview" onclick="togglePreview()">▶️ 預覽</button>
    <div class="sep"></div>
    <button onclick="undo()" title="Ctrl+Z">↩️ 復原</button>
    <button onclick="redo()" title="Ctrl+Y">↪️ 重做</button>
    <div class="sep"></div>
    <button onclick="loadDefaultMap1()">📋 預設地圖1</button>
    <button onclick="loadDefaultMap2()">📋 預設地圖2</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importMap(event)">
</div>

<div id="main-area">
    <div id="canvas-wrap">
        <canvas id="editorCanvas"></canvas>
    </div>
    <div id="side-panel">
        <div class="panel-section">
            <h3>🎨 繪製筆刷</h3>
            <div class="palette-grid" id="brush-palette">
                <button class="brush-btn" data-brush="wall" onclick="selectBrush('wall')">
                    <div class="brush-preview" style="background:#2a1a1a;"></div>
                    <span class="brush-label">🧱 牆壁</span>
                </button>
                <button class="brush-btn" data-brush="fence" onclick="selectBrush('fence')">
                    <div class="brush-preview" id="prev-fence"></div>
                    <span class="brush-label">🪵 柵欄</span>
                </button>
                <button class="brush-btn" data-brush="plain" onclick="selectBrush('plain')">
                    <div class="brush-preview" style="background:#1a3a1a;"></div>
                    <span class="brush-label">🌿 空地</span>
                </button>
                <button class="brush-btn" data-brush="erase" onclick="selectBrush('erase')">
                    <div class="brush-preview" style="background:transparent; border:2px dashed #e94560;"></div>
                    <span class="brush-label">🗑️ 擦除</span>
                </button>
            </div>
        </div>
        <div class="panel-section">
            <h3>📍 路徑工具</h3>
            <button class="path-tool-btn active" data-path-tool="add" onclick="selectPathTool('add')">➕ 新增航點</button>
            <button class="path-tool-btn" data-path-tool="move" onclick="selectPathTool('move')">✋ 移動航點</button>
            <button class="path-tool-btn" data-path-tool="del" onclick="selectPathTool('del')">✂️ 刪除航點</button>
        </div>
        <div class="panel-section">
            <h3>📊 地圖資訊</h3>
            <div class="info-row"><span>網格</span>32 × 18</div>
            <div class="info-row"><span>TILE</span>32px</div>
            <div class="info-row"><span>路徑點</span id="pointCount">0</div>
            <div class="info-row"><span>起點</span id="startPos">-</div>
            <div class="info-row"><span>終點</span id="endPos">-</div>
        </div>
        <div class="panel-section">
            <h3>⌨️ 快速鍵</h3>
            <div class="info-row">1-4<span>選筆刷</span></div>
            <div class="info-row">P<span>預覽切換</span></div>
            <div class="info-row">Del<span>刪除航點</span></div>
            <div class="info-row">Esc<span>取消選取</span></div>
            <div class="info-row">Ctrl+Z<span>復原</span></div>
            <div class="info-row">Ctrl+Y<span>重做</span></div>
        </div>
    </div>
</div>

<div id="status-bar">
    <span>🖱️ 滑鼠 <span id="mousePos">(0, 0)</span></span>
    <span>🖌️ 筆刷 <span id="brushLabel">無</span></span>
    <span>📍 工具 <span class="active" id="toolLabel">新增航點</span></span>
    <span style="margin-left:auto;" class="key-hint">右鍵=擦除　預覽中不可編輯</span>
</div>

<div id="toast"></div>

<script>
// ============================
// 常數與狀態
// ============================
const COLS = 32, ROWS = 18, TILE = 32;
const CANVAS_W = COLS * TILE, CANVAS_H = ROWS * TILE;

const TILE_TYPES = { PLAIN: 0, ROAD: 1, WALL: 2, BASE_ZONE: 3, FENCE_BUFFER: 4 };
const TILE_COLORS = { 0: '#1a3a1a', 1: '#3a3a2a', 2: '#2a1a1a', 3: '#1a1a2a', 4: '#1a3a1a' };

const canvas = document.getElementById('editorCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

let path = [];
let tileData = [];
let selectedBrush = null;
let currentPathTool = 'add';
let isPreviewing = false;
let previewProgress = 0;
let dragIndex = -1;
let selectedIndex = -1;
let isPainting = false;
let animFrame = null;
let undoStack = [];
let redoStack = [];
const MAX_UNDO = 30;

// 圖片快取
const Images = {
    ground: null, road: null, fence: null, base: null
};

(function initImages() {
    const g = new Image();
    g.onerror = () => {};
    g.src = 'PIC/MOONGRN.jpg';
    Images.ground = g;

    const r = new Image();
    r.onerror = () => {};
    r.src = 'PIC/Roads.jpg';
    Images.road = r;

    const f = new Image();
    f.onerror = () => {};
    f.src = 'PIC/GAPs.png';
    f.onload = () => {
        const c = document.getElementById('prev-fence');
        if (c) { c.style.background = 'url(PIC/GAPs.png) center/cover'; }
    };
    Images.fence = f;

    const b = new Image();
    b.onerror = () => {};
    b.src = 'PIC/bases.png';
    Images.base = b;
})();

// ============================
// 格線輔助函數
// ============================
function getGridPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    const px = (e.clientX - rect.left) * sx;
    const py = (e.clientY - rect.top) * sy;
    return {
        col: Math.max(0, Math.min(COLS - 1, Math.floor(px / TILE))),
        row: Math.max(0, Math.min(ROWS - 1, Math.floor(py / TILE)))
    };
}

function getPixel(col, row) {
    return { x: col * TILE + TILE / 2, y: row * TILE + TILE / 2 };
}

function isOnPath(col, row) {
    for (let i = 0; i < path.length - 1; i++) {
        const p1 = path[i], p2 = path[i + 1];
        if (p1.x === p2.x && col === p1.x && row >= Math.min(p1.y, p2.y) && row <= Math.max(p1.y, p2.y)) return true;
        if (p1.y === p2.y && row === p1.y && col >= Math.min(p1.x, p2.x) && col <= Math.max(p1.x, p2.x)) return true;
    }
    return false;
}

function findNearestPoint(col, row) {
    const th = TILE;
    for (let i = 0; i < path.length; i++) {
        const dx = Math.abs(path[i].x - col);
        const dy = Math.abs(path[i].y - row);
        if (dx <= 1 && dy <= 1 && (dx + dy) <= 1) return i;
    }
    return -1;
}

function findNearestSegment(col, row) {
    for (let i = 0; i < path.length - 1; i++) {
        const p1 = path[i], p2 = path[i + 1];
        if (p1.x === p2.x && col === p1.x) {
            if (row > Math.min(p1.y, p2.y) && row < Math.max(p1.y, p2.y)) return i;
        }
        if (p1.y === p2.y && row === p1.y) {
            if (col > Math.min(p1.x, p2.x) && col < Math.max(p1.x, p2.x)) return i;
        }
    }
    return -1;
}

// ============================
// Tile 生成
// ============================
function generateTileDataFromPath(p) {
    const grid = [];
    for (let r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(TILE_TYPES.PLAIN));
    if (!p || p.length < 2) return grid;

    // ROAD
    for (let i = 0; i < p.length - 1; i++) {
        const a = p[i], b = p[i + 1];
        if (a.x === b.x) {
            for (let y = Math.min(a.y, b.y); y <= Math.max(a.y, b.y); y++) grid[y][a.x] = TILE_TYPES.ROAD;
        } else {
            for (let x = Math.min(a.x, b.x); x <= Math.max(a.x, b.x); x++) grid[a.y][x] = TILE_TYPES.ROAD;
        }
    }
    // FENCE_BUFFER
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c] !== TILE_TYPES.ROAD) continue;
            for (let [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === TILE_TYPES.PLAIN) {
                    grid[nr][nc] = TILE_TYPES.FENCE_BUFFER;
                }
            }
        }
    }
    // BASE_ZONE
    const end = p[p.length - 1];
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const nx = end.x + dx, ny = end.y + dy;
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) grid[ny][nx] = TILE_TYPES.BASE_ZONE;
        }
    }
    return grid;
}

function regenerateTileData() {
    const auto = generateTileDataFromPath(path);
    // 保留 WALL tile
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (tileData[r] && tileData[r][c] === TILE_TYPES.WALL && auto[r][c] !== TILE_TYPES.ROAD && auto[r][c] !== TILE_TYPES.BASE_ZONE) {
                auto[r][c] = TILE_TYPES.WALL;
            }
        }
    }
    tileData = auto;
}

// ============================
// 復原系統
// ============================
function pushUndo() {
    undoStack.push(JSON.parse(JSON.stringify({ path, tileData })));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
}

// ============================
// Tile 筆刷
// ============================
function selectBrush(brush) {
    selectedBrush = brush;
    document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`[data-brush="${brush}"]`);
    if (btn) btn.classList.add('active');
    const label = document.getElementById('brushLabel');
    label.textContent = {
        wall: '🧱 牆壁', fence: '🪵 柵欄', plain: '🌿 空地', erase: '🗑️ 擦除'
    }[brush] || brush;
    label.classList.add('active');
    if (currentPathTool !== 'brush') selectPathTool('brush');
    if (isPreviewing) togglePreview();
}

function selectPathTool(tool) {
    currentPathTool = tool;
    document.querySelectorAll('.path-tool-btn').forEach(b => b.classList.remove('active'));
    if (tool !== 'brush') {
        document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
        selectedBrush = null;
        document.getElementById('brushLabel').textContent = '無';
        document.getElementById('brushLabel').classList.remove('active');
        const toolBtn = document.querySelector(`[data-path-tool="${tool}"]`);
        if (toolBtn) toolBtn.classList.add('active');
    }
    document.getElementById('toolLabel').textContent = {
        add: '新增航點', move: '移動航點', del: '刪除航點', brush: '繪製筆刷'
    }[tool] || tool;
    selectedIndex = -1;
    dragIndex = -1;
    render();
}

function canPlaceTile(col, row, type) {
    if (type === TILE_TYPES.ROAD) {
        // 繪製道路等於改變路徑，應由路徑工具控制，筆刷不支援
        return false;
    }
    if (tileData[row][col] === TILE_TYPES.BASE_ZONE) return false;
    if (tileData[row][col] === TILE_TYPES.ROAD && type !== TILE_TYPES.PLAIN) return false;
    return true;
}

function paintTile(col, row, brush) {
    let targetType;
    switch (brush) {
        case 'wall': targetType = TILE_TYPES.WALL; break;
        case 'fence': targetType = TILE_TYPES.FENCE_BUFFER; break;
        case 'plain': case 'erase': targetType = TILE_TYPES.PLAIN; break;
        default: return;
    }
    if (tileData[row][col] === TILE_TYPES.BASE_ZONE) return;
    if (tileData[row][col] === TILE_TYPES.ROAD && targetType !== TILE_TYPES.PLAIN) return;
    if (tileData[row][col] === targetType) return;
    pushUndo();
    tileData[row][col] = targetType;
}

// ============================
// 路徑編輯
// ============================
function isValidPathSegment(x1, y1, x2, y2) {
    if (x1 < 0 || x1 >= COLS || y1 < 0 || y1 >= ROWS || x2 < 0 || x2 >= COLS || y2 < 0 || y2 >= ROWS) return false;
    return x1 === x2 || y1 === y2;
}

function addPoint(col, row) {
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    if (findNearestPoint(col, row) !== -1) return;
    if (path.length > 0) {
        if (!isValidPathSegment(path[path.length - 1].x, path[path.length - 1].y, col, row)) return;
    }
    pushUndo();
    path.push({ x: col, y: row });
    regenerateTileData();
    selectedIndex = path.length - 1;
    updateStatus();
}

function insertPointAfter(segIndex, col, row) {
    if (segIndex < 0 || segIndex >= path.length - 1) return;
    pushUndo();
    path.splice(segIndex + 1, 0, { x: col, y: row });
    regenerateTileData();
    selectedIndex = segIndex + 1;
    updateStatus();
}

function removePoint(index) {
    if (index < 0 || index >= path.length) return;
    if (path.length <= 2) return;
    pushUndo();
    path.splice(index, 1);
    if (selectedIndex === index) selectedIndex = -1;
    else if (selectedIndex > index) selectedIndex--;
    regenerateTileData();
    updateStatus();
}

function movePoint(index, col, row) {
    if (index < 0 || index >= path.length) return;
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    if (index > 0 && !isValidPathSegment(path[index - 1].x, path[index - 1].y, col, row)) return;
    if (index < path.length - 1 && !isValidPathSegment(col, row, path[index + 1].x, path[index + 1].y)) return;
    if (path[index].x === col && path[index].y === row) return;
    pushUndo();
    path[index] = { x: col, y: row };
    regenerateTileData();
    updateStatus();
}

function clearPath() {
    if (path.length === 0 && tileData.every(r => r.every(c => c === 0))) return;
    pushUndo();
    path = [];
    tileData = generateTileDataFromPath(path);
    selectedIndex = -1;
    if (isPreviewing) togglePreview();
    updateStatus();
}

// ============================
// 匯出 / 匯入
// ============================
function exportMap() {
    if (path.length < 2) { showToast('❌ 路徑至少需要 2 個點'); return; }
    const data = {
        name: document.getElementById('mapName').value || '未命名地圖',
        tileWidth: COLS, tileHeight: ROWS, tileSize: TILE, tileSet: 'custom',
        tileData: tileData,
        path: path.map(p => ({ x: p.x, y: p.y }))
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (document.getElementById('mapName').value || '新地圖').replace(/[/\\?%*:|"<>]/g, '_') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✅ 地圖已匯出');
}

function importMap(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.path || !Array.isArray(data.path) || data.path.length < 2) {
                showToast('❌ 地圖格式錯誤：path 至少需要 2 個點');
                return;
            }
            for (let p of data.path) {
                if (typeof p.x !== 'number' || typeof p.y !== 'number' || p.x < 0 || p.x >= COLS || p.y < 0 || p.y >= ROWS) {
                    showToast('❌ 路徑點超出範圍');
                    return;
                }
            }
            for (let i = 0; i < data.path.length - 1; i++) {
                if (data.path[i].x !== data.path[i + 1].x && data.path[i].y !== data.path[i + 1].y) {
                    showToast('❌ 路徑必須是水平或垂直線段');
                    return;
                }
            }
            pushUndo();
            path = data.path.map(p => ({ x: p.x, y: p.y }));
            tileData = (data.tileData && data.tileData.length === ROWS) ? data.tileData : generateTileDataFromPath(path);
            if (data.name) document.getElementById('mapName').value = data.name;
            selectedIndex = -1;
            if (isPreviewing) togglePreview();
            undoStack = []; redoStack = [];
            updateStatus();
            showToast(`✅ 已載入地圖: ${data.name || '未命名'}`);
        } catch (err) {
            showToast('❌ JSON 解析失敗：' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function newMap() {
    if (path.length > 0) pushUndo();
    path = [];
    tileData = generateTileDataFromPath(path);
    selectedIndex = -1;
    undoStack = []; redoStack = [];
    document.getElementById('mapName').value = '新地圖';
    if (isPreviewing) togglePreview();
    updateStatus();
}

function loadDefaultMap1() {
    const data = { path: [
        { x: 0, y: 3 }, { x: 10, y: 3 }, { x: 10, y: 14 }, { x: 22, y: 14 }, { x: 22, y: 3 }, { x: 30, y: 3 }
    ]};
    pushUndo();
    path = data.path;
    tileData = generateTileDataFromPath(path);
    document.getElementById('mapName').value = '第一星區';
    selectedIndex = -1;
    if (isPreviewing) togglePreview();
    updateStatus();
    showToast('✅ 已載入預設地圖1');
}

function loadDefaultMap2() {
    const data = { path: [
        { x: 31, y: 14 }, { x: 10, y: 14 }, { x: 10, y: 4 }, { x: 24, y: 4 },
        { x: 24, y: 14 }, { x: 16, y: 14 }, { x: 16, y: 9 }, { x: 5, y: 9 }
    ]};
    pushUndo();
    path = data.path;
    tileData = generateTileDataFromPath(path);
    document.getElementById('mapName').value = '第二星區';
    selectedIndex = -1;
    if (isPreviewing) togglePreview();
    updateStatus();
    showToast('✅ 已載入預設地圖2');
}

// ============================
// 復原 / 重做
// ============================
function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(JSON.parse(JSON.stringify({ path, tileData })));
    const s = undoStack.pop();
    path = s.path;
    tileData = s.tileData;
    selectedIndex = -1;
    updateStatus();
}

function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(JSON.parse(JSON.stringify({ path, tileData })));
    const s = redoStack.pop();
    path = s.path;
    tileData = s.tileData;
    selectedIndex = -1;
    updateStatus();
}

// ============================
// Toast
// ============================
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============================
// 預覽
// ============================
function togglePreview() {
    if (path.length < 2) {
        isPreviewing = false;
        document.getElementById('btn-preview').textContent = '▶️ 預覽';
        render();
        return;
    }
    isPreviewing = !isPreviewing;
    document.getElementById('btn-preview').textContent = isPreviewing ? '⏹️ 停止' : '▶️ 預覽';
    if (isPreviewing) {
        previewProgress = 0;
        runPreview();
    } else {
        if (animFrame) cancelAnimationFrame(animFrame);
        render();
    }
}

function runPreview() {
    if (!isPreviewing) return;
    renderPreview(previewProgress);
    previewProgress += 2;
    const segs = path.length - 1;
    const totalDist = segs * TILE;
    if (previewProgress > totalDist) previewProgress = 0;
    animFrame = requestAnimationFrame(runPreview);
}

function getPreviewPos(progress) {
    if (path.length < 2) return null;
    let remaining = progress;
    for (let i = 0; i < path.length - 1; i++) {
        const dx = (path[i + 1].x - path[i].x) * TILE;
        const dy = (path[i + 1].y - path[i].y) * TILE;
        const segLen = Math.abs(dx) + Math.abs(dy);
        if (remaining <= segLen) {
            const t = segLen > 0 ? remaining / segLen : 0;
            return { x: path[i].x * TILE + TILE / 2 + dx * t, y: path[i].y * TILE + TILE / 2 + dy * t };
        }
        remaining -= segLen;
    }
    const last = path[path.length - 1];
    return { x: last.x * TILE + TILE / 2, y: last.y * TILE + TILE / 2 };
}

// ============================
// 渲染
// ============================
function drawGround() {
    const img = Images.ground;
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
    } else {
        ctx.fillStyle = '#1a3a1a';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
}

function drawTiles() {
    const roadImg = Images.road, fenceImg = Images.fence;
    const showRoad = roadImg && roadImg.complete && roadImg.naturalWidth > 0;
    const showFence = fenceImg && fenceImg.complete && fenceImg.naturalWidth > 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const type = tileData[r] ? tileData[r][c] : 0;
            if (type === TILE_TYPES.PLAIN || type === TILE_TYPES.BASE_ZONE) continue;
            const x = c * TILE, y = r * TILE;
            if (type === TILE_TYPES.ROAD && showRoad) {
                ctx.drawImage(roadImg, x, y, TILE, TILE);
            } else if (type === TILE_TYPES.FENCE_BUFFER && showFence) {
                ctx.drawImage(fenceImg, x, y, TILE, TILE);
            } else {
                ctx.fillStyle = TILE_COLORS[type] || TILE_COLORS[0];
                ctx.fillRect(x, y, TILE, TILE);
            }
        }
    }
}

function drawGrid() {
    ctx.strokeStyle = 'rgba(31, 40, 51, 0.5)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * TILE, 0);
        ctx.lineTo(c * TILE, CANVAS_H);
        ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * TILE);
        ctx.lineTo(CANVAS_W, r * TILE);
        ctx.stroke();
    }
}

function drawPathLines() {
    if (path.length < 2) return;
    ctx.strokeStyle = '#45a29e';
    ctx.lineWidth = TILE * 0.7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    path.forEach((p, i) => {
        const px = p.x * TILE + TILE / 2;
        const py = p.y * TILE + TILE / 2;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    });
    ctx.stroke();
    // 方向箭頭
    ctx.fillStyle = 'rgba(102, 252, 241, 0.5)';
    for (let i = 0; i < path.length - 1; i++) {
        const mid = { x: (path[i].x + path[i + 1].x) / 2, y: (path[i].y + path[i + 1].y) / 2 };
        const dx = path[i + 1].x - path[i].x, dy = path[i + 1].y - path[i].y;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len === 0) continue;
        const ux = dx / len, uy = dy / len;
        const mx = mid.x * TILE + TILE / 2, my = mid.y * TILE + TILE / 2;
        const as = 7;
        ctx.beginPath();
        ctx.moveTo(mx + ux * as, my + uy * as);
        ctx.lineTo(mx - ux * as + uy * as * 0.5, my - uy * as - ux * as * 0.5);
        ctx.lineTo(mx - ux * as - uy * as * 0.5, my - uy * as + ux * as * 0.5);
        ctx.fill();
    }
}

function drawPoints() {
    path.forEach((p, i) => {
        const px = p.x * TILE + TILE / 2;
        const py = p.y * TILE + TILE / 2;
        const isStart = i === 0, isEnd = i === path.length - 1;
        let color, radius, label;
        if (isStart) { color = '#66fcf1'; radius = 8; label = '起'; }
        else if (isEnd) { color = '#e94560'; radius = 8; label = '終'; }
        else { color = selectedIndex === i ? '#ffd700' : '#fff'; radius = 5; }
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (isStart || isEnd) {
            ctx.fillStyle = '#000';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, px, py);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.font = '9px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(`(${p.x},${p.y})`, px, py + radius + 2);
    });
}

function drawBase() {
    if (path.length < 2) return;
    const end = path[path.length - 1];
    const bx = end.x * TILE + TILE / 2;
    const by = end.y * TILE + TILE / 2;
    const bs = 96;
    const img = Images.base;
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, bx - bs / 2, by - bs / 2, bs, bs);
    } else {
        ctx.fillStyle = '#2a1a1a';
        ctx.fillRect(bx - bs / 2, by - bs / 2, bs, bs);
        ctx.strokeStyle = '#ff4400';
        ctx.lineWidth = 3;
        ctx.strokeRect(bx - bs / 2, by - bs / 2, bs, bs);
    }
}

function drawHoverPreview(col, row) {
    if (isPreviewing) return;
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    if (currentPathTool === 'add') {
        if (findNearestPoint(col, row) !== -1) return;
        if (path.length > 0 && !isValidPathSegment(path[path.length - 1].x, path[path.length - 1].y, col, row)) return;
        ctx.fillStyle = 'rgba(102,252,241,0.3)';
        ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
    } else if (currentPathTool === 'brush' && selectedBrush) {
        if (tileData[row][col] === TILE_TYPES.BASE_ZONE) return;
        if (tileData[row][col] === TILE_TYPES.ROAD && selectedBrush !== 'plain' && selectedBrush !== 'erase') return;
        ctx.fillStyle = 'rgba(102,252,241,0.25)';
        ctx.strokeStyle = 'rgba(102,252,241,0.6)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(col * TILE + 1, row * TILE + 1, TILE - 2, TILE - 2);
        ctx.fillRect(col * TILE + 1, row * TILE + 1, TILE - 2, TILE - 2);
    }
}

function render() {
    if (isPreviewing) return;
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    drawGround();
    drawTiles();
    drawGrid();
    drawPathLines();
    drawBase();
    drawPoints();
}

function renderPreview(progress) {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    drawGround();
    drawTiles();
    drawGrid();
    drawPathLines();
    drawBase();
    drawPoints();
    const pos = getPreviewPos(progress);
    if (pos) {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#66fcf1';
        ctx.fill();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#66fcf1';
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function updateStatus() {
    document.getElementById('pointCount').textContent = path.length;
    document.getElementById('startPos').textContent = path.length > 0 ? `(${path[0].x}, ${path[0].y})` : '-';
    document.getElementById('endPos').textContent = path.length > 1 ? `(${path[path.length - 1].x}, ${path[path.length - 1].y})` : '-';
    render();
}

// ============================
// 事件處理
// ============================
canvas.addEventListener('mousedown', (e) => {
    if (isPreviewing) return;
    if (e.button === 2) return;
    const g = getGridPos(e);

    if (currentPathTool === 'brush' && selectedBrush) {
        isPainting = true;
        paintTile(g.col, g.row, selectedBrush);
        render();
    } else if (currentPathTool === 'add') {
        const idx = findNearestPoint(g.col, g.row);
        const segIdx = findNearestSegment(g.col, g.row);
        if (idx !== -1) {
            if (path.length > 2) { selectedIndex = idx; render(); }
        } else if (segIdx !== -1) {
            insertPointAfter(segIdx, g.col, g.row);
        } else {
            addPoint(g.col, g.row);
        }
    } else if (currentPathTool === 'move') {
        const idx = findNearestPoint(g.col, g.row);
        if (idx !== -1) {
            dragIndex = idx;
            selectedIndex = idx;
            render();
        }
    } else if (currentPathTool === 'del') {
        const idx = findNearestPoint(g.col, g.row);
        if (idx !== -1) removePoint(idx);
    }
});

canvas.addEventListener('mousemove', (e) => {
    const g = getGridPos(e);
    document.getElementById('mousePos').textContent = `(${g.col}, ${g.row})`;

    if (dragIndex !== -1 && currentPathTool === 'move') {
        movePoint(dragIndex, g.col, g.row);
    }
    if (isPainting && currentPathTool === 'brush' && selectedBrush) {
        paintTile(g.col, g.row, selectedBrush);
        render();
    }
    if (!isPainting && dragIndex === -1 && !isPreviewing) {
        render();
        drawHoverPreview(g.col, g.row);
    }
});

canvas.addEventListener('mouseup', () => {
    dragIndex = -1;
    isPainting = false;
});

canvas.addEventListener('mouseleave', () => {
    dragIndex = -1;
    isPainting = false;
    if (!isPreviewing) render();
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (isPreviewing) return;
    const g = getGridPos(e);
    if (selectedBrush) {
        paintTile(g.col, g.row, 'erase');
        render();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedIndex !== -1 && currentPathTool !== 'brush') {
            removePoint(selectedIndex);
        }
    }
    if (e.key === 'Escape') {
        selectedIndex = -1;
        render();
    }
    if (e.key === 'p' || e.key === 'P') { togglePreview(); return; }
    if (e.key === '1') { selectBrush('wall'); return; }
    if (e.key === '2') { selectBrush('fence'); return; }
    if (e.key === '3') { selectBrush('plain'); return; }
    if (e.key === '4') { selectBrush('erase'); return; }
});

// ============================
// 初始化
// ============================
path = [
    { x: 0, y: 5 }, { x: 8, y: 5 }, { x: 8, y: 14 }, { x: 16, y: 14 },
    { x: 16, y: 5 }, { x: 24, y: 5 }, { x: 24, y: 14 }, { x: 31, y: 14 }
];
tileData = generateTileDataFromPath(path);
selectPathTool('add');
updateStatus();
</script>
